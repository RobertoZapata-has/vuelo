<!doctype html>
<html lang="es-AR" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B10">
<title>Pronóstico de vuelo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---- Panel de instrumentos, modo noche ---- */
:root{
  --field:#070B10; --panel:#0D151E; --panel-2:#111C27; --rule:rgba(125,165,195,.22);
  --live:#E9F2F8; --dim:#8AA3B5; --ref:#5BC8E8; --sel:#E364CE;
  --go:#1FD27E; --caution:#FFB300; --warn:#FF3B46;
  --go-ink:#1FD27E; --caution-ink:#FFB300; --warn-ink:#FF3B46;
  --glow:.45;
  --disp:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --text:"Saira",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-mode="day"]{
  --field:#E4EBF0; --panel:#FFFFFF; --panel-2:#F2F6F9; --rule:rgba(10,40,60,.18);
  --live:#0A1620; --dim:#54707F; --ref:#0A6E8C; --sel:#A5219A;
  --go:#0E7F4F; --caution:#8F6000; --warn:#B3202F;
  --go-ink:#0E7F4F; --caution-ink:#8F6000; --warn-ink:#B3202F;
  --glow:0;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--field)}
body{
  margin:0;background:var(--field);color:var(--live);
  font:16px/1.45 var(--text);-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ref);outline-offset:2px}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.01em}
.wrap{max-width:600px;margin:0 auto;padding:0 12px 32px}

/* ---- Cabecera ---- */
.bar{display:flex;align-items:center;gap:8px;padding:12px 2px 10px;border-bottom:1px solid var(--rule)}
.site{flex:1;text-align:left;min-width:0}
.site b{display:block;font-family:var(--disp);font-size:25px;font-weight:600;line-height:1.05}
.site span{display:block;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.knob{width:42px;height:42px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);font-size:17px;flex:none}
.knob:active{background:var(--panel-2)}

/* ---- Visor principal ---- */
.pfd{position:relative;margin:12px 0;padding:14px;background:var(--panel);
     border:1px solid var(--rule);border-top:2px solid var(--st);
     --st:var(--ref);display:flex;gap:14px;align-items:center}
.pfd.s0{--st:var(--go)} .pfd.s1{--st:var(--caution)} .pfd.s2{--st:var(--warn)}
.pfd::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 18% 0%, color-mix(in srgb, var(--st) 14%, transparent), transparent 62%);
  opacity:var(--glow)}
.rose{flex:none;width:150px;height:150px}
.call{flex:1;min-width:0;position:relative;z-index:1}
.call .stamp{font-size:12.5px;color:var(--dim)}
.call h1{margin:1px 0 7px;font-family:var(--disp);font-weight:700;font-size:35px;line-height:.98;
  color:var(--st);text-shadow:0 0 calc(18px*var(--glow)) color-mix(in srgb,var(--st) 55%,transparent)}
.call ul{margin:0;padding:0;list-style:none;font-size:14.5px;line-height:1.35}
.call li{display:flex;gap:7px;padding:2px 0;color:var(--live)}
.call li::before{content:"";flex:none;width:3px;align-self:stretch;margin:3px 0;background:var(--d)}
.call li.d2{--d:var(--warn)} .call li.d1{--d:var(--caution)} .call li.d0{--d:var(--go)}

/* ---- Días y cinta horaria ---- */
.days{display:flex;gap:4px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.days::-webkit-scrollbar,.tape::-webkit-scrollbar{display:none}
.days button{flex:none;padding:5px 9px 4px;border:1px solid var(--rule);border-radius:2px;
  font-family:var(--disp);font-size:15px;font-weight:600;color:var(--dim);background:var(--panel)}
.days button[aria-pressed="true"]{color:var(--live);border-color:var(--sel);background:var(--panel-2)}
.days i{display:block;height:3px;margin-top:4px;border-radius:1px}
.tape{display:flex;gap:2px;overflow-x:auto;padding:0 0 4px;scroll-snap-type:x proximity}
.tape button{flex:none;width:38px;scroll-snap-align:center;padding:5px 0 0;position:relative;
  font-family:var(--disp);font-size:14px;font-weight:600;color:var(--dim)}
.tape button i{display:block;height:7px;margin-top:4px;background:var(--c)}
.tape .l0{--c:var(--go)} .tape .l1{--c:var(--caution)} .tape .l2{--c:var(--warn)}
.tape .past{opacity:.38}
.tape button[aria-pressed="true"]{color:var(--live);box-shadow:inset 0 0 0 1px var(--sel)}
.tape button[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:-4px;width:7px;height:7px;
  margin-left:-3.5px;background:var(--sel);clip-path:polygon(50% 0,100% 100%,0 100%)}
.window{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  padding:9px 0 2px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--dim)}
.window b{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--live)}

/* ---- Lecturas ---- */
.reads{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.cell{background:var(--panel);border:1px solid var(--rule);padding:9px 11px 10px;min-width:0}
.cell.wide{grid-column:1/-1}
.cell .lab{font-size:12.5px;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.cell .lab em{font-style:normal;color:var(--ref)}
.cell .read{font-family:var(--disp);font-weight:700;font-size:31px;line-height:1.12;
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px}
.cell .read u{text-decoration:none;font-size:16px;font-weight:500;color:var(--dim)}
.cell .sub{font-size:12.5px;color:var(--dim);margin-top:1px}
.cell.c0 .read{color:var(--go-ink)} .cell.c1 .read{color:var(--caution-ink)} .cell.c2 .read{color:var(--warn-ink)}
.scale{position:relative;height:4px;margin-top:7px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--rule)}
.scale i{position:absolute;inset:0 auto 0 0;background:var(--go)}
.scale.c1 i{background:var(--caution)} .scale.c2 i{background:var(--warn)}
.scale b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ref)}
.sky{display:flex;gap:12px;align-items:center}
.sky svg{flex:none;width:132px;height:132px}
.sky .side{flex:1;min-width:0}

/* ---- Pie ---- */
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  margin-top:14px;padding-top:9px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--dim)}
.foot button{border:1px solid var(--rule);padding:5px 11px;color:var(--live);background:var(--panel)}
.note{padding:38px 8px;text-align:center;color:var(--dim);font-size:15px}

/* ---- Diálogos ---- */
dialog{border:1px solid var(--rule);padding:0;width:min(93vw,430px);background:var(--panel);color:var(--live)}
dialog::backdrop{background:rgba(2,6,10,.72)}
.dh{font-family:var(--disp);font-size:23px;font-weight:600;padding:13px 16px;border-bottom:1px solid var(--rule)}
.db{padding:14px 16px 16px}
.field{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:7px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.field input,.field select{width:96px;padding:6px 8px;border:1px solid var(--rule);background:var(--panel-2);
  color:var(--live);font:600 15px var(--disp);text-align:right;border-radius:0}
.wide-in{width:100%;padding:10px 11px;border:1px solid var(--rule);background:var(--panel-2);color:var(--live);font:inherit}
.hits{list-style:none;margin:8px 0 0;padding:0;max-height:40vh;overflow:auto}
.hits button{display:block;width:100%;text-align:left;padding:9px 2px;border-bottom:1px solid var(--rule)}
.hits small{color:var(--dim)}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--rule);padding:9px 14px;background:var(--panel-2)}
.btn.go{background:var(--ref);border-color:var(--ref);color:#04131A;font-weight:600}
:root[data-mode="day"] .btn.go{color:#fff}
.tip{font-size:12.5px;color:var(--dim);margin:10px 0 0;line-height:1.4}
@media (min-width:430px){ .rose{width:168px;height:168px} .call h1{font-size:41px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <button class="site" id="siteBtn"><b id="siteName">Mendoza</b><span id="siteSub">Tocá para cambiar el lugar</span></button>
    <button class="knob" id="modeBtn" aria-label="Cambiar entre modo día y noche">☀</button>
    <button class="knob" id="setBtn" aria-label="Límites de vuelo">⚙</button>
  </header>
  <main id="app"><p class="note">Buscando el pronóstico…</p></main>
</div>

<dialog id="siteDlg">
  <div class="dh">Lugar de vuelo</div>
  <div class="db">
    <button class="btn go" id="gpsBtn" style="width:100%">Usar mi ubicación</button>
    <p class="tip">O buscá el lugar por su nombre:</p>
    <input class="wide-in" id="q" type="search" placeholder="Potrerillos, Cacheuta, Uspallata…" autocomplete="off">
    <ul class="hits" id="hits"></ul>
    <div class="acts"><button class="btn" id="siteClose">Cerrar</button></div>
  </div>
</dialog>

<dialog id="setDlg">
  <div class="dh">Límites de vuelo</div>
  <div class="db">
    <form id="setForm" method="dialog">
      <label class="field">Altura de vuelo (m)<select name="alt"><option>10</option><option>80</option><option>120</option></select></label>
      <label class="field">Viento máximo (m/s)<input name="windMax" type="number" step="0.5" min="1"></label>
      <label class="field">Ráfagas máximas (m/s)<input name="gustMax" type="number" step="0.5" min="1"></label>
      <label class="field">Temperatura mínima (°C)<input name="tMin" type="number" step="1"></label>
      <label class="field">Temperatura máxima (°C)<input name="tMax" type="number" step="1"></label>
      <label class="field">Probabilidad de lluvia máxima (%)<input name="rainMax" type="number" step="5" min="0" max="100"></label>
      <label class="field">Índice Kp máximo<input name="kpMax" type="number" step="1" min="1" max="9"></label>
      <label class="field">Satélites mínimos<input name="minSats" type="number" step="1" min="4" max="20"></label>
      <label class="field">Altura mínima del satélite (°)<input name="mask" type="number" step="5" min="5" max="45"></label>
      <label class="field">Volar de noche<select name="night"><option value="0">No</option><option value="1">Sí</option></select></label>
      <p class="tip">Vienen cargados los valores del DJI Mini SE: 249 g, resiste viento nivel 5 y opera entre 0 y 40 °C. El amarillo aparece al llegar al 80 % de cada límite.</p>
      <div class="acts">
        <button class="btn" type="button" id="resetBtn">Volver al Mini SE</button>
        <button class="btn go" value="save">Guardar</button>
      </div>
    </form>
  </div>
</dialog>

<script>
/* ========== Ajustes y estado ========== */
const MINI_SE = {alt:120, windMax:8, gustMax:10, tMin:0, tMax:40, rainMax:50, kpMax:5, night:0, minSats:7, mask:10};
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch{ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch{} }
};
let cfg  = {...MINI_SE, ...store.get('cfg',{})};
let loc  = store.get('loc',{name:'Mendoza',sub:'Mendoza, Argentina',lat:-32.889,lon:-68.845});
let data = null, selDay = null, selIdx = null, SATS = null;

const $   = s => document.querySelector(s);
const fmt = (n,d=1) => n==null||isNaN(n) ? '—' : Number(n).toLocaleString('es-AR',{maximumFractionDigits:d});
const CALL = ['Apto para volar','Volar con precaución','No volar'];

/* ========== Datos ========== */
async function fetchWeather(){
  const hourly = ['temperature_2m','dew_point_2m','precipitation_probability','weather_code','cloud_cover',
    'visibility','wind_speed_10m','wind_speed_80m','wind_speed_120m','wind_direction_10m','wind_direction_80m',
    'wind_direction_120m','wind_gusts_10m','is_day'].join(',');
  const p = new URLSearchParams({latitude:loc.lat, longitude:loc.lon, hourly, daily:'sunrise,sunset',
    wind_speed_unit:'ms', timezone:'auto', forecast_days:7});
  const r = await fetch('https://api.open-meteo.com/v1/forecast?'+p);
  if(!r.ok) throw new Error('Open-Meteo '+r.status);
  return r.json();
}
async function fetchKp(){
  try{
    const r = await fetch('https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json');
    const rows = await r.json();
    const toTs = s => { s=String(s).replace(' ','T'); return Date.parse(/Z$|[+-]\d\d:?\d\d$/.test(s)?s:s+'Z'); };
    if(Array.isArray(rows[0])) return rows.slice(1).map(x=>({ts:toTs(x[0]),kp:+x[1]}));
    return rows.map(o=>({ts:toTs(o.time_tag),kp:+o.kp}));
  }catch{ return []; }
}

/* ---- Satélites GNSS: órbitas reales de CelesTrak ---- */
async function loadTLE(){
  const c = store.get('tle',null);
  let txt = c && Date.now()-c.at < 24*3600e3 ? c.txt : null;
  if(!txt){
    const r = await fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=gnss&FORMAT=tle');
    if(!r.ok) throw new Error('TLE '+r.status);
    txt = await r.text();
    store.set('tle',{at:Date.now(), txt});
  }
  const L = txt.split(/\r?\n/).filter(x=>x.trim()), out=[];
  for(let i=0;i+2<L.length;i+=3){
    try{ const rec = satellite.twoline2satrec(L[i+1],L[i+2]); if(!rec.error) out.push(rec); }catch{}
  }
  return out;
}
function look(ts, keepDots){
  if(!SATS || !SATS.length || !window.satellite) return null;
  const d = new Date(ts), gmst = satellite.gstime(d);
  const obs = {longitude:loc.lon*Math.PI/180, latitude:loc.lat*Math.PI/180, height:0.8};
  const mask = cfg.mask*Math.PI/180, R = 180/Math.PI;
  let vis=0, blk=0; const dots = keepDots ? [] : null;
  for(const rec of SATS){
    try{
      const pv = satellite.propagate(rec, d);
      if(!pv || !pv.position) continue;
      const la = satellite.ecfToLookAngles(obs, satellite.eciToEcf(pv.position, gmst));
      if(la.elevation >= mask) vis++; else if(la.elevation > 0) blk++; else continue;
      if(dots) dots.push({az:la.azimuth*R, el:la.elevation*R, up:la.elevation>=mask});
    }catch{}
  }
  return {vis, blk, dots};
}
async function applySats(){
  try{ SATS = await loadTLE(); }catch{ SATS = []; return; }
  for(const h of data.hours){
    const s = look(h.ts,false);
    if(s){ h.sats=s.vis; h.blocked=s.blk; Object.assign(h, judge(h)); }
  }
  render();
}

function build(w, kp){
  const H = w.hourly, off = w.utc_offset_seconds*1000, A = String(cfg.alt);
  const hours = H.time.map((t,i)=>{
    const ts = Date.parse(t+'Z') - off;
    const wind = H['wind_speed_'+A+'m'][i], w10 = H.wind_speed_10m[i], g10 = H.wind_gusts_10m[i];
    const gust = A==='10' ? g10 : wind + Math.max(0, g10 - w10);
    const k = kp.filter(x=>x.ts<=ts && ts<x.ts+3*3600e3).pop();
    const h = {t, ts, day:t.slice(0,10), hour:+t.slice(11,13), wind, gust,
      dir:H['wind_direction_'+A+'m'][i], temp:H.temperature_2m[i], dew:H.dew_point_2m[i],
      rain:H.precipitation_probability[i], code:H.weather_code[i], cloud:H.cloud_cover[i],
      vis:H.visibility[i], isDay:H.is_day[i], kp:k?k.kp:null};
    h.base = (h.temp-h.dew)*125;
    Object.assign(h, judge(h));
    return h;
  });
  const sun = {};
  w.daily.time.forEach((d,i)=>sun[d]={rise:w.daily.sunrise[i].slice(11), set:w.daily.sunset[i].slice(11)});
  return {hours, sun, at:Date.now()};
}

/* ========== Reglas de vuelo ========== */
function judge(h){
  const r=[], L={};
  const chk=(key,val,max,txt,warnAt=.8)=>{
    if(val==null) return;
    if(val>max){ r.push([2,txt]); L[key]=2 }
    else if(val>max*warnAt){ r.push([1,txt]); L[key]=1 }
    else L[key]=0;
  };
  chk('wind', h.wind, cfg.windMax, `Viento de ${fmt(h.wind)} m/s a ${cfg.alt} m`);
  chk('gust', h.gust, cfg.gustMax, `Ráfagas de ${fmt(h.gust)} m/s`);
  chk('rain', h.rain, cfg.rainMax, `${h.rain}% de probabilidad de lluvia`, .5);
  if(h.code>=95){ r.push([2,'Tormenta eléctrica']); L.rain=2 }
  else if(h.code>=51){ r.push([2,'Precipitación: el Mini SE no resiste el agua']); L.rain=2 }

  if(h.temp<cfg.tMin || h.temp>cfg.tMax){ r.push([2,`Temperatura de ${fmt(h.temp,0)} °C, fuera de rango`]); L.temp=2 }
  else if(h.temp<cfg.tMin+5){ r.push([1,`Frío (${fmt(h.temp,0)} °C): calentá la batería antes`]); L.temp=1 }
  else L.temp=0;

  if(h.vis!=null){
    if(h.vis<1000){ r.push([2,'Visibilidad por debajo de 1 km']); L.vis=2 }
    else if(h.vis<3000){ r.push([1,'Visibilidad reducida']); L.vis=1 }
    else L.vis=0;
  }
  if(h.temp-h.dew<=2){ r.push([1,'Aire casi saturado: puede formarse niebla']); L.dew=1 } else L.dew=0;
  if(h.kp!=null){
    if(h.kp>=cfg.kpMax){ r.push([2,`Kp ${fmt(h.kp)}: GPS y brújula poco confiables`]); L.kp=2 }
    else if(h.kp>=cfg.kpMax-1){ r.push([1,`Kp ${fmt(h.kp)}: actividad geomagnética moderada`]); L.kp=1 }
    else L.kp=0;
  }
  if(h.sats!=null){
    if(h.sats<cfg.minSats){ r.push([2,`Solo ${h.sats} satélites sobre ${cfg.mask}°`]); L.sats=2 }
    else if(h.sats<cfg.minSats+3){ r.push([1,`Pocos satélites a la vista (${h.sats})`]); L.sats=1 }
    else L.sats=0;
  }
  if(!h.isDay){ r.push([cfg.night?1:2,'Es de noche']); L.night = cfg.night?1:2 }

  r.sort((a,b)=>b[0]-a[0]);
  return {level: r.length?r[0][0]:0, why:r, L};
}

const SKY  = c => c===0?'Despejado':c<=2?'Parcialmente nublado':c===3?'Nublado':c<=48?'Niebla':
  c<=57?'Llovizna':c<=67?'Lluvia':c<=77?'Nieve':c<=82?'Chaparrones':c<=86?'Nevadas':'Tormenta';
const CARD = d => ['norte','noreste','este','sureste','sur','suroeste','oeste','noroeste'][Math.round(d/45)%8];
const pad  = n => String(n).padStart(2,'0');

function bestWindow(list){
  let best=null, cur=null;
  for(const h of list){
    if(h.level===0 && h.ts>Date.now()-3600e3) cur = cur?{...cur,end:h.hour}:{start:h.hour,end:h.hour};
    else cur=null;
    if(cur && (!best || cur.end-cur.start>best.end-best.start)) best={...cur};
  }
  return best;
}

/* ========== Instrumentos ========== */
function rose(h){
  const C=100, ticks=[];
  for(let a=0;a<360;a+=15){
    const long = a%45===0, r1 = long?72:76, r2=82, rad=(a-90)*Math.PI/180;
    ticks.push(`<line x1="${C+r1*Math.cos(rad)}" y1="${C+r1*Math.sin(rad)}" x2="${C+r2*Math.cos(rad)}" y2="${C+r2*Math.sin(rad)}"
      stroke="var(--dim)" stroke-width="${long?1.6:1}" opacity="${long?.95:.5}"/>`);
  }
  const lab = [['N',0],['E',90],['S',180],['O',270]].map(([t,a])=>{
    const rad=(a-90)*Math.PI/180, r=60;
    return `<text x="${C+r*Math.cos(rad)}" y="${C+r*Math.sin(rad)+4.5}" text-anchor="middle"
      font-family="var(--disp)" font-size="13" font-weight="600" fill="var(--dim)">${t}</text>`;
  }).join('');
  // arco de intensidad: 0 → 1,5 veces el límite, abriendo 270°
  const lim = cfg.windMax, frac = Math.min(1, h.wind/(lim*1.5)), peak = Math.min(1, h.gust/(lim*1.5));
  const arc = (f,w,col,op) => {
    const a0=135, a1=135+270*f, R=90;
    const p = (a)=>[C+R*Math.cos((a-90)*Math.PI/180), C+R*Math.sin((a-90)*Math.PI/180)];
    const [x0,y0]=p(a0), [x1,y1]=p(a1);
    return f<=0.001?'':`<path d="M${x0} ${y0} A${R} ${R} 0 ${270*f>180?1:0} 1 ${x1} ${y1}"
      fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}"/>`;
  };
  const limMark = (()=>{ const a=135+270*(1/1.5), R=90, rad=(a-90)*Math.PI/180;
    return `<line x1="${C+(R-6)*Math.cos(rad)}" y1="${C+(R-6)*Math.sin(rad)}"
      x2="${C+(R+6)*Math.cos(rad)}" y2="${C+(R+6)*Math.sin(rad)}" stroke="var(--ref)" stroke-width="2.5"/>`;})();
  const col = ['var(--go)','var(--caution)','var(--warn)'][h.L.wind ?? 0];
  return `<svg class="rose" viewBox="0 0 200 200" role="img"
    aria-label="Viento de ${fmt(h.wind)} metros por segundo desde el ${CARD(h.dir)}">
    <circle cx="100" cy="100" r="90" fill="none" stroke="var(--rule)"/>
    <circle cx="100" cy="100" r="82" fill="none" stroke="var(--rule)"/>
    ${arc(1,5,'var(--rule)',.85)}${arc(peak,5,col,.32)}${arc(frac,5,col,1)}${limMark}
    ${ticks.join('')}${lab}
    <g style="transform:rotate(${h.dir}deg);transform-origin:100px 100px;transition:transform .45s ease">
      <path d="M100 43 L107.5 29 L92.5 29 Z" fill="var(--sel)"/>
      <line x1="100" y1="29" x2="100" y2="17" stroke="var(--sel)" stroke-width="2.6"/>
    </g>
    <text x="100" y="102" text-anchor="middle" font-family="var(--disp)" font-size="40" font-weight="700"
      fill="${col}" style="font-variant-numeric:tabular-nums">${fmt(h.wind)}</text>
    <text x="100" y="118" text-anchor="middle" font-family="var(--disp)" font-size="14" fill="var(--dim)">m/s · ráf ${fmt(h.gust)}</text>
  </svg>`;
}

function skyplot(h){
  const C=80, R=68, dots = (h.dots||[]).map(d=>{
    const rr = R*(1-d.el/90), rad=(d.az-90)*Math.PI/180;
    const x = C+rr*Math.cos(rad), y = C+rr*Math.sin(rad);
    return d.up ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.1" fill="var(--go)"/>`
                : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="none" stroke="var(--dim)" stroke-width="1.2" opacity=".75"/>`;
  }).join('');
  const maskR = R*(1-cfg.mask/90);
  return `<svg viewBox="0 0 160 160" role="img" aria-label="Mapa del cielo con ${h.sats??0} satélites utilizables">
    <circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--rule)"/>
    <circle cx="80" cy="80" r="${R*(1-30/90)}" fill="none" stroke="var(--rule)" opacity=".55"/>
    <circle cx="80" cy="80" r="${R*(1-60/90)}" fill="none" stroke="var(--rule)" opacity=".55"/>
    <circle cx="80" cy="80" r="${maskR}" fill="none" stroke="var(--ref)" stroke-width="1.2" stroke-dasharray="3 3" opacity=".85"/>
    <line x1="80" y1="${80-R}" x2="80" y2="${80+R}" stroke="var(--rule)" opacity=".5"/>
    <line x1="${80-R}" y1="80" x2="${80+R}" y2="80" stroke="var(--rule)" opacity=".5"/>
    ${dots}
    <text x="80" y="${80-R-3}" text-anchor="middle" font-family="var(--disp)" font-size="12" fill="var(--dim)">N</text>
  </svg>`;
}

const bar = (v,max,lvl) => `<div class="scale c${lvl??0}"><i style="width:${Math.max(0,Math.min(100,v/max*100)).toFixed(0)}%"></i><b style="left:calc(${(100/1.5).toFixed(0)}% - 1px)"></b></div>`;

/* ========== Pantalla ========== */
function render(){
  if(!data) return;
  const days = [...new Set(data.hours.map(h=>h.day))];
  if(!selDay || !days.includes(selDay)) selDay = days[0];
  const list = data.hours.filter(h=>h.day===selDay);
  if(selIdx==null || data.hours[selIdx].day!==selDay){
    const now=Date.now();
    selIdx = data.hours.indexOf(list.find(h=>h.ts+3600e3>now) || list.find(h=>h.hour===10) || list[0]);
  }
  const h = data.hours[selIdx], sun = data.sun[selDay]||{}, win = bestWindow(list);
  const det = look(h.ts,true); if(det) h.dots = det.dots;
  const dname = d => new Date(d+'T12:00:00Z').toLocaleDateString('es-AR',{weekday:'short',day:'numeric',timeZone:'UTC'});
  const why = h.why.slice(0,3);
  const lv = k => 'c'+(h.L[k] ?? 0);

  $('#app').innerHTML = `
  <section class="pfd s${h.level}" aria-live="polite">
    ${rose(h)}
    <div class="call">
      <p class="stamp">${dname(h.day)} · ${pad(h.hour)}:00 · ${SKY(h.code)}</p>
      <h1>${CALL[h.level]}</h1>
      <ul>${why.length ? why.map(x=>`<li class="d${x[0]}">${x[1]}</li>`).join('')
            : '<li class="d0">Todo dentro de los límites del dron</li>'}
        ${h.why.length>3 ? `<li class="d${h.why[3][0]}">y ${h.why.length-3} aviso${h.why.length-3>1?'s':''} más</li>`:''}</ul>
    </div>
  </section>

  <nav class="days" aria-label="Día">${days.map(d=>{
    const dh = data.hours.filter(x=>x.day===d && x.hour>=6 && x.hour<=21);
    const g = dh.filter(x=>x.level===0).length;
    const col = g>5?'var(--go)':g>0?'var(--caution)':'var(--warn)';
    return `<button data-day="${d}" aria-pressed="${d===selDay}">${dname(d)}<i style="background:${col}"></i></button>`;
  }).join('')}</nav>

  <div class="tape" id="tape" role="group" aria-label="Hora">${list.map(x=>{
    const i = data.hours.indexOf(x);
    return `<button class="l${x.level}${x.ts+3600e3<Date.now()?' past':''}" data-i="${i}" aria-pressed="${i===selIdx}"
      aria-label="${x.hour} horas: ${CALL[x.level]}">${pad(x.hour)}<i></i></button>`;
  }).join('')}</div>
  <p class="window"><span>${win?'Mejor ventana del día':'Sin horas aptas en este día'}</span>
    ${win?`<b>${pad(win.start)}:00 – ${pad(win.end+1)}:00</b>`:''}</p>

  <section class="reads">
    <div class="cell ${lv('temp')}"><div class="lab">Temperatura<em>${fmt(cfg.tMin,0)}–${fmt(cfg.tMax,0)} °C</em></div>
      <div class="read">${fmt(h.temp,0)}<u>°C</u></div><div class="sub">Rocío ${fmt(h.dew,0)} °C</div></div>
    <div class="cell ${lv('rain')}"><div class="lab">Lluvia<em>máx ${cfg.rainMax}%</em></div>
      <div class="read">${h.rain??'—'}<u>%</u></div>${bar(h.rain||0, cfg.rainMax*1.5, h.L.rain)}</div>
    <div class="cell"><div class="lab">Nubes</div>
      <div class="read">${h.cloud}<u>%</u></div><div class="sub">Base a ${fmt(Math.max(0,h.base),0)} m</div></div>
    <div class="cell ${lv('vis')}"><div class="lab">Visibilidad</div>
      <div class="read">${h.vis==null?'—':fmt(h.vis/1000,0)}<u>km</u></div><div class="sub">Mantené el dron a la vista</div></div>
    <div class="cell ${lv('gust')}"><div class="lab">Ráfagas<em>máx ${fmt(cfg.gustMax)}</em></div>
      <div class="read">${fmt(h.gust)}<u>m/s</u></div>${bar(h.gust, cfg.gustMax*1.5, h.L.gust)}</div>
    <div class="cell ${lv('kp')}"><div class="lab">Índice Kp<em>máx ${cfg.kpMax}</em></div>
      <div class="read">${fmt(h.kp,2)}</div><div class="sub">${h.kp==null?'Sin dato de la NOAA':'Tormenta solar desde 5'}</div></div>

    <div class="cell wide">
      <div class="sky">
        ${skyplot(h)}
        <div class="side">
          <div class="lab">Satélites sobre el horizonte</div>
          <div class="read ${h.sats!=null&&h.sats<cfg.minSats?'':''}" style="color:${h.sats==null?'var(--dim)':(h.L.sats===2?'var(--warn-ink)':h.L.sats===1?'var(--caution-ink)':'var(--go-ink)')}">
            ${h.sats??'···'}<u>utilizables</u></div>
          <div class="sub" style="margin-top:4px">${h.blocked??'···'} tapados por el terreno, bajo los ${cfg.mask}°</div>
          <div class="sub">El círculo punteado es tu ángulo de corte. Mínimo ${cfg.minSats} para despegar.</div>
        </div>
      </div>
    </div>

    <div class="cell wide"><div class="lab">Luz del día<em>${h.isDay?'En el aire':'Fuera de horario'}</em></div>
      <div class="read" style="font-size:25px">${sun.rise||'—'}<u>amanecer</u> &nbsp; ${sun.set||'—'}<u>atardecer</u></div></div>
  </section>

  <div class="foot"><span>Open-Meteo · NOAA · CelesTrak · ${new Date(data.at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}</span>
    <button id="refresh">Actualizar</button></div>`;

  $('#app').querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selDay=b.dataset.day;selIdx=null;render()});
  $('#app').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{selIdx=+b.dataset.i;render()});
  $('#refresh').onclick = load;
  const cur = $('#tape [aria-pressed="true"]'); if(cur) $('#tape').scrollLeft = cur.offsetLeft - 90;
}

async function load(){
  $('#siteName').textContent = loc.name;
  $('#siteSub').textContent  = loc.sub || 'Tocá para cambiar el lugar';
  if(!data) $('#app').innerHTML = '<p class="note">Buscando el pronóstico…</p>';
  try{
    const [w,kp] = await Promise.all([fetchWeather(), fetchKp()]);
    data = build(w,kp); render(); applySats();
  }catch{
    $('#app').innerHTML = `<p class="note">No llegó el pronóstico. Revisá la conexión y volvé a intentar.<br><br>
      <button class="btn go" id="retry">Reintentar</button></p>`;
    $('#retry').onclick = load;
  }
}

/* ========== Modo día / noche ========== */
const applyMode = m => {
  document.documentElement.dataset.mode = m;
  $('#modeBtn').textContent = m==='night' ? '☀' : '☾';
  $('#modeBtn').setAttribute('aria-label', m==='night' ? 'Cambiar al modo día' : 'Cambiar al modo noche');
  document.querySelector('meta[name=theme-color]').content = m==='night' ? '#070B10' : '#E4EBF0';
};
applyMode(store.get('mode','night'));
$('#modeBtn').onclick = () => {
  const m = document.documentElement.dataset.mode==='night' ? 'day' : 'night';
  store.set('mode',m); applyMode(m);
};

/* ========== Lugar ========== */
$('#siteBtn').onclick  = () => $('#siteDlg').showModal();
$('#siteClose').onclick = () => $('#siteDlg').close();
$('#gpsBtn').onclick = () => {
  if(!navigator.geolocation) return alert('Este navegador no da la ubicación.');
  $('#gpsBtn').textContent = 'Buscando…';
  navigator.geolocation.getCurrentPosition(p=>{
    loc = {name:'Mi ubicación', sub:`${p.coords.latitude.toFixed(3)}, ${p.coords.longitude.toFixed(3)}`,
           lat:p.coords.latitude, lon:p.coords.longitude};
    store.set('loc',loc); $('#gpsBtn').textContent='Usar mi ubicación'; $('#siteDlg').close(); data=null; load();
  }, ()=>{ $('#gpsBtn').textContent='Usar mi ubicación'; alert('No se pudo leer la ubicación. Revisá el permiso del navegador.'); },
  {enableHighAccuracy:true, timeout:15000});
};
let qt;
$('#q').oninput = e => {
  clearTimeout(qt); const q = e.target.value.trim();
  if(q.length<3){ $('#hits').innerHTML=''; return }
  qt = setTimeout(async()=>{
    try{
      const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?'+new URLSearchParams({name:q,count:6,language:'es'}));
      const j = await r.json();
      $('#hits').innerHTML = (j.results||[]).map((x,i)=>
        `<li><button data-g="${i}">${x.name}<br><small>${[x.admin2,x.admin1,x.country].filter(Boolean).join(', ')}</small></button></li>`
      ).join('') || '<li class="tip">Sin resultados. Probá con otro nombre.</li>';
      $('#hits').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
        const x = j.results[+b.dataset.g];
        loc = {name:x.name, sub:[x.admin1,x.country].filter(Boolean).join(', '), lat:x.latitude, lon:x.longitude};
        store.set('loc',loc); $('#siteDlg').close(); data=null; load();
      });
    }catch{ $('#hits').innerHTML='<li class="tip">No se pudo buscar. Revisá la conexión.</li>' }
  },350);
};

/* ========== Límites ========== */
const form = $('#setForm');
const fill = c => Object.keys(MINI_SE).forEach(k=>form.elements[k].value=c[k]);
$('#setBtn').onclick   = () => { fill(cfg); $('#setDlg').showModal() };
$('#resetBtn').onclick = () => fill(MINI_SE);
form.onsubmit = () => { Object.keys(MINI_SE).forEach(k=>cfg[k]=+form.elements[k].value); store.set('cfg',cfg); load() };

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
</html>
